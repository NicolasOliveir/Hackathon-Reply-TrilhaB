[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rivexx-autonomous-squad"
version = "0.1.0"
description = "Control plane for the Rivexx autonomous AI squad"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
contracts = [
  "jsonschema>=4.19,<5",
  "PyYAML>=6,<7"
]
control-api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7,<3"
]
control-api-dev = [
  "rivexx-autonomous-squad[control-api,contracts]",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  # Gera os modelos Pydantic a partir de packages/contracts/schemas/v1.
  # Ferramenta de build: nao e importada em runtime pelo control-api.
  "datamodel-code-generator>=0.25"
]

[tool.setuptools]
packages = []
