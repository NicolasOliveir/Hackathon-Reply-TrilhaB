openapi: 3.1.0
info:
  title: Rivexx Squad Control API
  version: 1.0.0
  description: API mínima da primeira iteração distribuída.
servers:
  - url: http://localhost:8000
paths:
  /api/v1/runs:
    post:
      operationId: createRun
      summary: Cria uma execução a partir de um briefing.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/v1/create-run-request.schema.json
      responses:
        "202":
          description: Execução aceita.
          content:
            application/json:
              schema:
                $ref: ../../schemas/v1/run-response.schema.json
        "409":
          description: Idempotency key já usada com payload diferente.
  /api/v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Consulta o estado atual da execução.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Estado atual.
          content:
            application/json:
              schema:
                $ref: ../../schemas/v1/run-response.schema.json
        "404":
          description: Execução não encontrada.
  /api/v1/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      summary: Acompanha eventos e permite retomada pelo sequence.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Stream de EventEnvelope serializado como SSE.
          content:
            text/event-stream:
              schema:
                type: string
  /internal/v1/tasks/{task_id}/context:
    get:
      operationId: getTaskContext
      summary: Retorna somente o contexto autorizado para a tarefa autenticada.
      security:
        - TaskBearer: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Contexto filtrado por papel e tarefa.
          content:
            application/json:
              schema:
                $ref: ../../schemas/v1/agent-task-context.schema.json
        "403":
          description: Token sem escopo ou vinculado a outra tarefa.
  /internal/v1/tasks/{task_id}/outputs:
    post:
      operationId: submitFakeWorkerOutput
      summary: Submete a saída validada do fake worker.
      security:
        - TaskBearer: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/v1/fake-worker-output.schema.json
      responses:
        "202":
          description: Saída aceita para processamento.
        "409":
          description: Saída duplicada ou incompatível com o estado atual.
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    TaskBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-task-token
  schemas:
    CreateRunRequest:
      $ref: ../../schemas/v1/create-run-request.schema.json
    RunResponse:
      $ref: ../../schemas/v1/run-response.schema.json
    EventEnvelope:
      $ref: ../../schemas/v1/event-envelope.schema.json
    AgentTaskContext:
      $ref: ../../schemas/v1/agent-task-context.schema.json
    FakeWorkerOutput:
      $ref: ../../schemas/v1/fake-worker-output.schema.json
