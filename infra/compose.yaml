name: rivexx-squad

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-rivexx}"
      POSTGRES_USER: "${POSTGRES_USER:-rivexx}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-development-only}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - control_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  control-api:
    image: "${CONTROL_API_IMAGE:-rivexx/control-api-stub:local}"
    build:
      context: ./stubs/control-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rivexx}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-rivexx}"
      STUB_RUN_ID: "${RUN_ID:-11111111-1111-4111-8111-111111111111}"
      STUB_TASK_TOKEN: "${TASK_TOKEN:-local-demo-task-token}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONTROL_API_BIND_ADDRESS:-127.0.0.1}:${CONTROL_API_PORT:-8000}:8000"
    volumes:
      - run_workspaces:/var/lib/rivexx/workspaces
      - run_artifacts:/var/lib/rivexx/artifacts
    networks:
      - public_net
      - control_net
      - agent_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  control-panel:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      control-api:
        condition: service_healthy
    ports:
      - "${CONTROL_PANEL_BIND_ADDRESS:-127.0.0.1}:${CONTROL_PANEL_PORT:-4173}:80"
    volumes:
      - ./stubs/control-panel/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - public_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  fake-worker:
    profiles: ["manual"]
    image: "${FAKE_WORKER_IMAGE:-rivexx/fake-worker:local}"
    build:
      context: ../services/agent-worker
    environment:
      RUN_ID: "${RUN_ID:-11111111-1111-4111-8111-111111111111}"
      TASK_ID: "${TASK_ID:-22222222-2222-4222-8222-222222222222}"
      CONTROL_API_URL: "http://control-api:8000"
      TASK_TOKEN: "${TASK_TOKEN:-local-demo-task-token}"
    depends_on:
      control-api:
        condition: service_healthy
    networks:
      - agent_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    restart: "no"

networks:
  public_net:
  control_net:
    internal: true
  agent_net:
    internal: true

volumes:
  postgres_data:
  run_workspaces:
  run_artifacts:
