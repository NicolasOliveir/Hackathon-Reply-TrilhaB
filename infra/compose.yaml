name: rivexx-squad

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-rivexx}"
      POSTGRES_USER: "${POSTGRES_USER:-rivexx}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-development-only}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - control_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  control-api:
    image: "${CONTROL_API_IMAGE:-rivexx/control-api:local}"
    build:
      context: ..
      dockerfile: services/control-api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rivexx}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-rivexx}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8000}"
      RUNTIME_BACKEND: "docker"
      SCHEDULER_ENABLED: "true"
      SCHEDULER_IDLE_SECONDS: "${SCHEDULER_IDLE_SECONDS:-0.5}"
      FAKE_WORKER_IMAGE: "${FAKE_WORKER_IMAGE:-rivexx/fake-worker:local}"
      AGENT_NETWORK: "${AGENT_NETWORK:-rivexx-squad_agent_net}"
      INTERNAL_BASE_URL: "http://control-api:8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONTROL_API_BIND_ADDRESS:-127.0.0.1}:${CONTROL_API_PORT:-8000}:8000"
    volumes:
      # Precisa ser bind, não volume nomeado: o runtime monta subdiretórios
      # deste mesmo source nos containers Dev/QA através do daemon do host.
      - type: bind
        source: "${WORKSPACE_HOST_ROOT:-../.rivexx-data/workspaces}"
        target: /var/lib/rivexx/workspaces
      - run_artifacts:/var/lib/rivexx/artifacts
      # O socket pertence somente ao plano de controle. O worker dinâmico não
      # recebe este mount; `:ro` também impede alterações no inode do host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public_net
      - control_net
      - agent_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  control-panel:
    image: "${CONTROL_PANEL_IMAGE:-rivexx/control-panel:local}"
    build:
      context: ..
      dockerfile: apps/control-panel/Dockerfile
      args:
        VITE_CONTROL_API_URL: "${VITE_CONTROL_API_URL:-}"
    restart: unless-stopped
    depends_on:
      control-api:
        condition: service_healthy
    ports:
      - "${CONTROL_PANEL_BIND_ADDRESS:-127.0.0.1}:${CONTROL_PANEL_PORT:-4173}:80"
    networks:
      - public_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  fake-worker:
    profiles: ["manual"]
    image: "${FAKE_WORKER_IMAGE:-rivexx/fake-worker:local}"
    build:
      context: ../services/agent-worker
    environment:
      RUN_ID: "${RUN_ID:-11111111-1111-4111-8111-111111111111}"
      TASK_ID: "${TASK_ID:-22222222-2222-4222-8222-222222222222}"
      CONTROL_API_URL: "http://control-api:8000"
      TASK_TOKEN: "${TASK_TOKEN:-local-demo-task-token}"
    depends_on:
      control-api:
        condition: service_healthy
    networks:
      - agent_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    restart: "no"

  e2e:
    profiles: ["e2e"]
    image: "${E2E_IMAGE:-rivexx/e2e:local}"
    build:
      context: ..
      dockerfile: tests/e2e/Dockerfile
    init: true
    ipc: host
    depends_on:
      control-api:
        condition: service_healthy
      control-panel:
        condition: service_healthy
    environment:
      E2E_PANEL_URL: "http://control-panel"
      E2E_API_URL: "http://control-api:8000"
    networks:
      - public_net
    restart: "no"

networks:
  public_net:
  control_net:
    internal: true
  agent_net:
    internal: true

volumes:
  postgres_data:
  run_artifacts:
